<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-bg { fill: url(#grid); }
    
    /* Dynamic Animated Background Elements */
    .pulse-orb-1 {
      animation: floatOrb1 8s infinite alternate ease-in-out;
    }
    .pulse-orb-2 {
      animation: floatOrb2 10s infinite alternate ease-in-out;
    }
    .wave-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: dash 6s linear infinite;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.45; }
      100% { transform: translate(-20px, 15px) scale(0.95); opacity: 0.25; }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-40px, 25px) scale(1.2); opacity: 0.5; }
      100% { transform: translate(25px, -15px) scale(1); opacity: 0.3; }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Foreground Text Styles - Layered Safely Above Animations */
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="800" height="220" rx="12" class="bg"/>
  <rect width="800" height="220" rx="12" class="grid-bg"/>

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS (Layered in Background) -->
  <g opacity="0.35">
    <!-- Glowing Orb 1 -->
    <circle cx="120" cy="60" r="90" fill="#38bdf8" class="pulse-orb-1" filter="url(#glow)" opacity="0.3"/>
    <!-- Glowing Orb 2 -->
    <circle cx="680" cy="160" r="110" fill="#818cf8" class="pulse-orb-2" filter="url(#glow)" opacity="0.3"/>
    
    <!-- Dynamic Location Node Network Overlay -->
    <path d="M 50 170 Q 200 110 350 150 T 650 120 T 750 60" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="wave-line" opacity="0.6"/>
    
    <!-- Animated Location Pins/Nodes -->
    <circle cx="200" cy="125" r="4" fill="#38bdf8"/>
    <circle cx="350" cy="150" r="5" fill="#818cf8"/>
    <circle cx="500" cy="130" r="4" fill="#c084fc"/>
    <circle cx="650" cy="120" r="5" fill="#38bdf8"/>
  </g>

  <!-- Accent Top Border Glow -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- FOREGROUND CONTENT (Guaranteed High Contrast & Visibility) -->
  <g transform="translate(40, 0)">
    <!-- Location Pin Icon Graphic -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="48" height="48" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
      <path d="M 24 12 C 18.477 12 14 16.477 14 22 C 14 29.5 24 36 24 36 C 24 36 34 29.5 34 22 C 34 16.477 29.523 12 24 12 Z M 24 25 C 22.343 25 21 23.657 21 22 C 21 20.343 22.343 19 24 19 C 25.657 19 27 20.343 27 22 C 27 23.657 25.657 25 24 25 Z" fill="url(#accentGrad)"/>
    </g>

    <!-- Tagline Badge -->
    <text x="64" y="66" class="badge-text">LOCAL SEO &amp; PRESENCE PLATFORMS</text>

    <!-- Title -->
    <text x="64" y="102" class="title-text">Awesome Listing Management Platform</text>

    <!-- Subtitle -->
    <text x="64" y="134" class="subtitle-text">Curated SaaS Platforms, NAP Consistency Tools &amp; Open-Source Local SEO Engines</text>

    <!-- Feature Pill Indicators -->
    <g transform="translate(64, 154)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="12" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">📍 Business Listings</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="145" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="157" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">🔄 NAP Consistency</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="145" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="312" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">🚀 Google Business API</text>
    </g>
  </g>
</svg>
